<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/superhero/bootstrap.min.css">
  <link rel="stylesheet" href="/stylesheets/main.css">
  <script src="/javascripts/jquery.js"></script>
  <script src="/javascripts/handlebars.js"></script>
</head>
<body>
  <div class="container text-center my-5">
    <h1 class="text-primary">Contacts</h1>
    <p>Manage your personal and professional network</p>

    <div id="toast-container" aria-live="polite"></div>

    <button class="btn btn-secondary text-nowrap" type="button" id="add-contact-button">Add New Contact</button>

    <form id="contact-form" class="hidden" novalidate>
      <div class="field-group">
        <label for="fullNameInput" class="form-label mt-4">Full Name</label>
        <input type="text" name="full_name" class="form-control" id="fullNameInput" placeholder="Full name" required>
        <span class="field-error hidden"></span>
      </div>

      <div class="field-group">
        <label for="emailInput" class="form-label mt-4">Email</label>
        <input type="email" name="email" class="form-control" id="emailInput" placeholder="Email" required>
        <span class="field-error hidden"></span>
      </div>

      <div class="field-group">
        <label for="telephoneInput" class="form-label mt-4">Phone number</label>
        <input type="tel" name="phone_number" class="form-control" id="telephoneInput" placeholder="Phone number" required pattern="[\d\s\+\-\(\)]{7,15}">
        <span class="field-error hidden"></span>
      </div>

      <div class="field-group">
        <label for="tagsInput" class="form-label mt-4">Tags</label>
        <input type="text" name="tags" class="form-control" id="tagsInput" placeholder="Optional tags, separated by comma">
        <span class="field-error hidden"></span>
      </div>

      <button class="btn btn-secondary mt-4" type="button" id="cancel-add-contact">Cancel</button>
      <button class="btn btn-primary mt-4" type="submit">Save Contact</button>
    </form>

    <div class="d-flex align-items-center my-5">
      <div class="input-group">
        <input type="text" id="search" class="form-control" placeholder="Search by name, email, or tag…" aria-label="Search">
      </div>
    </div>

    <div class="d-flex flex-wrap" id="contacts">
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js" integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>
  <script src="/javascripts/main.js"></script>
</body>
</html>
